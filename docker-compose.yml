version: '3.8'

services:
  db:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: coffee_bot
    ports:
      - "5432:5432"
    volumes:
      - coffee_data:/var/lib/postgresql/data
    networks:
      - coffee_network

volumes:
  coffee_data:

networks:
  coffee_network:
